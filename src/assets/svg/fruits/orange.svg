<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <defs>
    <!-- Orange Fruit Gradient -->
    <radialGradient id="orangeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFC107" />    <!-- Bright highlight -->
      <stop offset="50%" stop-color="#FF9800" />   <!-- Main orange -->
      <stop offset="100%" stop-color="#E65100" />  <!-- Deep orange shadow -->
    </radialGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />   <!-- Light green -->
      <stop offset="100%" stop-color="#2E7D32" />  <!-- Dark green -->
    </linearGradient>
  </defs>

  <!-- Leaf -->
  <path 
    d="M 50,28 C 35,10 65,5 75,18 C 65,30 50,28 50,28 Z" 
    fill="url(#leafGrad)" 
  />

  <!-- Stem -->
  <path 
    d="M 50,28 Q 48,22 52,18" 
    stroke="#4E342E" 
    stroke-width="3" 
    stroke-linecap="round" 
    fill="none" 
  />

  <!-- Main Orange Body -->
  <circle 
    cx="50" 
    cy="58" 
    r="32" 
    fill="url(#orangeGrad)" 
  />

  <!-- Subtle Dimple at Top -->
  <ellipse 
    cx="50" 
    cy="28" 
    rx="3" 
    ry="1.5" 
    fill="#BF360C" 
    opacity="0.5" 
  />
</svg>
