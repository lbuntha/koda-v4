<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <defs>
    <!-- Top Face Gradient (Brightest Light Source) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>

    <!-- Front Left Face Gradient (Mid-Tone Shadow) -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <!-- Front Right Face Gradient (Deep Shadow) -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01579B" />
      <stop offset="100%" stop-color="#002F6C" />
    </linearGradient>
  </defs>

  <!-- Top Face -->
  <polygon 
    points="50,15 85,32 50,50 15,32" 
    fill="url(#topFace)" 
  />

  <!-- Front Left Face -->
  <polygon 
    points="15,32 50,50 50,85 15,67" 
    fill="url(#leftFace)" 
  />

  <!-- Front Right Face -->
  <polygon 
    points="50,50 85,32 85,67 50,85" 
    fill="url(#rightFace)" 
  />

  <!-- Subtle Outline Strokes for Sharp Edges -->
  <polygon 
    points="50,15 85,32 50,50 15,32" 
    fill="none" 
    stroke="#E0F7FA" 
    stroke-width="0.5" 
    opacity="0.6" 
  />
  <polygon 
    points="15,32 50,50 50,85 15,67" 
    fill="none" 
    stroke="#80DEEA" 
    stroke-width="0.5" 
    opacity="0.4" 
  />
  <polygon 
    points="50,50 85,32 85,67 50,85" 
    fill="none" 
    stroke="#80DEEA" 
    stroke-width="0.5" 
    opacity="0.4" 
  />
</svg>
