<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Star</title>
  <!--
    Drawn in `currentColor`, like the flame and the bolt beside it.

    This carried a gold-to-orange-red gradient of its own, which no wrapper could
    override: "Lessons mastered" rendered amber on Home and on the profile
    whatever the CSS said, and amber is the one hue docs/THEME.md rules out. The
    colour belongs to whoever draws the star, not to the star.

    The geometry is untouched — same ten points, same rounded joins — so only its
    paint has changed.
  -->
  <polygon
    points="50,5 63,35 95,38 71,61 78,92 50,75 22,92 29,61 5,38 37,35"
    fill="currentColor"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>
