<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <defs>
    <!-- Define the gradient -->
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />    <!-- Gold -->
      <stop offset="100%" stop-color="#FF4500" />  <!-- Orange-Red -->
    </linearGradient>
  </defs>

  <!-- Star path filled with the gradient -->
  <polygon 
    points="50,5 63,35 95,38 71,61 78,92 50,75 22,92 29,61 5,38 37,35" 
    fill="url(#starGradient)" 
    stroke="#D4AF37" 
    stroke-width="1.5" 
    stroke-linejoin="round" 
  />
</svg>
