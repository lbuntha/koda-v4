<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Star</title>
  <defs>
    <!-- Base Gradient (Gold) -->
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Top Highlight Gradient (3D Light Effect) -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Base Shape -->
    <path fill="url(#baseGradient)" d="
      M 50,22
      C 51,22 52,23 53,25
      L 58,36
      L 70,38
      C 72,38 73,40 72,42
      L 63,50
      L 65,62
      C 65,64 63,65 61,64
      L 50,58
      L 39,64
      C 37,65 35,64 35,62
      L 37,50
      L 28,42
      C 27,40 28,38 30,38
      L 42,36
      L 47,25
      C 48,23 49,22 50,22
      Z"
      stroke-linejoin="round"
    />

    <!-- 3D Bevel Highlight Layer -->
    <path fill="url(#highlightGradient)" d="
      M 50,22
      L 47,25
      L 42,36
      L 30,38
      L 37,50
      L 35,62
      L 50,55
      Z"
    />
  </g>
</svg>
