<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 200">
  <!--
    Counting's card: a scattered set, touched in order, each one badged.

    Not a row and not a grid, because the skill's hard part is exactly the one a
    tidy arrangement hides — keeping track of what you have already counted when
    the objects are not lined up for you. So the card draws what TouchOrbit
    draws: a scatter, the numbered discs the `counting_badges` feature stamps on
    each tap (orange on white, the lesson's own colours), the faint path through
    them in tap order, and the last number said, which is how many there are.

    Objects vary in colour the way a real set does — violet, sky, rose, emerald,
    the app palette. No amber or yellow anywhere.
  -->
  <defs>
    <linearGradient id="cntGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#281B52"/>
      <stop offset="100%" stop-color="#110C28"/>
    </linearGradient>
    <linearGradient id="cntViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cntSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cntRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="cntEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cntTotal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="cntGlow" cx="40%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="200" rx="18" fill="url(#cntGround)"/>
  <ellipse cx="150" cy="102" rx="156" ry="92" fill="url(#cntGlow)"/>

  <text x="30" y="38" font-family="system-ui, sans-serif" font-size="19" font-weight="700"
        letter-spacing="2.5" fill="#E9D5FF">COUNTING</text>

  <!-- The order you went in: "go in order so you do not miss any", drawn. -->
  <polyline points="48,108 82,78 116,116 150,82 184,122 218,88 250,124"
            fill="none" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="2 7"/>

  <!-- The set. Seven, scattered, each already touched once — and only once. -->
  <g>
    <circle cx="48"  cy="108" r="15" fill="url(#cntViolet)"/>
    <circle cx="82"  cy="78"  r="15" fill="url(#cntSky)"/>
    <circle cx="116" cy="116" r="15" fill="url(#cntRose)"/>
    <circle cx="150" cy="82"  r="15" fill="url(#cntEmerald)"/>
    <circle cx="184" cy="122" r="15" fill="url(#cntViolet)"/>
    <circle cx="218" cy="88"  r="15" fill="url(#cntSky)"/>
    <circle cx="250" cy="124" r="15" fill="url(#cntRose)"/>
  </g>

  <!-- The badges: a saturated disc with a white ring, exactly as the lesson
       stamps them, so a child sees the same mark on the card and in the round. -->
  <g fill="#F97316" stroke="#FFFFFF" stroke-width="1.8">
    <circle cx="59"  cy="97"  r="8"/>
    <circle cx="93"  cy="67"  r="8"/>
    <circle cx="127" cy="105" r="8"/>
    <circle cx="161" cy="71"  r="8"/>
    <circle cx="195" cy="111" r="8"/>
    <circle cx="229" cy="77"  r="8"/>
    <circle cx="261" cy="113" r="8"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="800"
     fill="#FFFFFF" text-anchor="middle">
    <text x="59"  y="101">1</text>
    <text x="93"  y="71" >2</text>
    <text x="127" y="109">3</text>
    <text x="161" y="75" >4</text>
    <text x="195" y="115">5</text>
    <text x="229" y="81" >6</text>
    <text x="261" y="117">7</text>
  </g>

  <!-- The last number you said is how many there are. -->
  <text x="336" y="122" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="66" font-weight="800" fill="url(#cntTotal)">7</text>

  <text x="30" y="176" font-family="system-ui, sans-serif" font-size="12" font-weight="700"
        fill="#E9D5FF" fill-opacity="0.72">One to one · Compare · See at a glance</text>
</svg>
