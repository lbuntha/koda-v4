<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bsGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0C1B33"/>
    </linearGradient>
    <radialGradient id="bsGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bsGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

    <!-- One bottle, reused. Straight sides and a short neck: the genre's shape,
         and the silhouette the lesson itself draws. -->
    <path id="bsBottle" d="M13 2 v7 C13 15 2 15 2 24 V66 q0 6 6 6 h25 q6 0 6 -6 V24 C39 15 28 15 28 9 V2 Z"/>
    <clipPath id="bsClip"><use href="#bsBottle"/></clipPath>
  </defs>

  <rect width="400" height="200" rx="18" fill="url(#bsGround)"/>
  <ellipse cx="200" cy="96" rx="150" ry="88" fill="url(#bsGlow)"/>

  <!-- Two mixed bottles and one finished: the whole skill in three objects.
       Shapes ride the bands because a colour alone does not say which colour to
       a child who cannot tell them apart, and the lesson never lets it. -->
  <g transform="translate(34 52)">
    <use href="#bsBottle" fill="#0F172A" fill-opacity="0.55"/>
    <g clip-path="url(#bsClip)">
      <rect x="0" y="60" width="41" height="12" fill="#7C3AED"/>
      <rect x="0" y="48" width="41" height="12" fill="#34D399"/>
      <rect x="0" y="36" width="41" height="12" fill="#7C3AED"/>
      <rect x="0" y="0" width="41" height="72" fill="url(#bsGlass)"/>
    </g>
    <circle cx="20.5" cy="66" r="3.6" fill="#fff" fill-opacity="0.92"/>
    <rect x="17.3" y="50.8" width="6.4" height="6.4" fill="#fff" fill-opacity="0.92"/>
    <circle cx="20.5" cy="42" r="3.6" fill="#fff" fill-opacity="0.92"/>
    <use href="#bsBottle" fill="none" stroke="#64748B" stroke-width="2.2"/>
  </g>

  <g transform="translate(86 52)">
    <use href="#bsBottle" fill="#0F172A" fill-opacity="0.55"/>
    <g clip-path="url(#bsClip)">
      <rect x="0" y="60" width="41" height="12" fill="#38BDF8"/>
      <rect x="0" y="48" width="41" height="12" fill="#FB7185"/>
      <rect x="0" y="0" width="41" height="72" fill="url(#bsGlass)"/>
    </g>
    <path d="M20.5 62 24.6 69H16.4Z" fill="#fff" fill-opacity="0.92"/>
    <path d="M20.5 50 24.6 54 20.5 58 16.4 54Z" fill="#fff" fill-opacity="0.92"/>
    <use href="#bsBottle" fill="none" stroke="#64748B" stroke-width="2.2"/>
  </g>

  <!-- Finished: full, one colour, and outlined the way the lesson marks a
       bottle that is done. -->
  <g transform="translate(138 52)">
    <use href="#bsBottle" fill="#0F172A" fill-opacity="0.55"/>
    <g clip-path="url(#bsClip)">
      <rect x="0" y="24" width="41" height="48" fill="#34D399"/>
      <rect x="0" y="0" width="41" height="72" fill="url(#bsGlass)"/>
    </g>
    <circle cx="20.5" cy="66" r="3.6" fill="#fff" fill-opacity="0.92"/>
    <circle cx="20.5" cy="54" r="3.6" fill="#fff" fill-opacity="0.92"/>
    <circle cx="20.5" cy="42" r="3.6" fill="#fff" fill-opacity="0.92"/>
    <circle cx="20.5" cy="30" r="3.6" fill="#fff" fill-opacity="0.92"/>
    <use href="#bsBottle" fill="none" stroke="#34D399" stroke-width="2.6"/>
  </g>

  <!-- The pour, which is the one thing this skill does that no other does.
       Tipped past the horizontal about its own middle, so the mouth is *below*
       the body: a bottle whose lip sits above its liquid pours nothing. The
       liquid sits at the neck end for the same reason. -->
  <g transform="translate(233 8) rotate(112 20.5 37)">
    <use href="#bsBottle" fill="#0F172A" fill-opacity="0.55"/>
    <g clip-path="url(#bsClip)">
      <rect x="0" y="2" width="41" height="46" fill="#FB7185"/>
      <rect x="0" y="0" width="41" height="72" fill="url(#bsGlass)"/>
    </g>
    <use href="#bsBottle" fill="none" stroke="#64748B" stroke-width="2.2"/>
  </g>

  <!-- Out of the lip sideways, into the mouth falling: a projectile arc, which
       is the shape the activity draws too. -->
  <path d="M286 58 Q301 58 301 84" fill="none" stroke="#FB7185" stroke-width="7" stroke-linecap="round"/>
  <circle cx="295" cy="60" r="2" fill="#fff" fill-opacity="0.5"/>
  <circle cx="301" cy="74" r="1.7" fill="#fff" fill-opacity="0.4"/>

  <g transform="translate(279.5 74)">
    <use href="#bsBottle" fill="#0F172A" fill-opacity="0.55"/>
    <g clip-path="url(#bsClip)">
      <rect x="0" y="60" width="41" height="12" fill="#FB7185"/>
      <rect x="0" y="0" width="41" height="72" fill="url(#bsGlass)"/>
    </g>
    <path d="M20.5 62 24.6 69H16.4Z" fill="#fff" fill-opacity="0.92"/>
    <use href="#bsBottle" fill="none" stroke="#64748B" stroke-width="2.2"/>
  </g>

  <text x="200" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#E0E7FF">BOTTLE SORT</text>
</svg>
