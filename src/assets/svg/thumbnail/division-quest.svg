<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 200">
  <!--
    Division's card: fourteen shared between three plates, and two that would
    not go.

    A deal rather than a division sign, for the reason multiplication's card is
    an array: the picture should be the thing the skill teaches. The leftover is
    drawn, and drawn in its own colour, because it is what makes division
    different from the three operations before it — every other card on the
    shelf comes out even.

    The ground is the family's purple-black rather than a navy of its own, and
    the title is set the way five of the six others set theirs. Multiplication
    has no title, which is the one card this sat beside while being drawn — and
    following the exception rather than the rule is how a shelf stops looking
    like a shelf.

    The four colours are the skill's own and mean the same here as on screen:
    sky for what is being shared, violet for the groups it goes into, emerald
    for the answer, rose for what is left. No amber or yellow anywhere.
  -->
  <defs>
    <linearGradient id="divGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#251A46"/>
      <stop offset="100%" stop-color="#100B24"/>
    </linearGradient>
    <linearGradient id="divCounter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="divLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="divAnswer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="divGlow" cx="34%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="200" fill="url(#divGround)"/>
  <ellipse cx="138" cy="100" rx="152" ry="106" fill="url(#divGlow)"/>

  <text x="28" y="34" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="15" font-weight="700" letter-spacing="3.4" fill="#DDD6FE">DIVISION</text>

  <!-- Three plates, four on each. The equal share. -->
  <g>
    <g fill="none" stroke="#8B5CF6" stroke-width="2.5" opacity="0.85">
      <rect x="28"  y="52" width="54" height="52" rx="12"/>
      <rect x="88"  y="52" width="54" height="52" rx="12"/>
      <rect x="148" y="52" width="54" height="52" rx="12"/>
    </g>
    <g fill="url(#divCounter)">
      <circle cx="46"  cy="70" r="7.5"/><circle cx="64"  cy="70" r="7.5"/>
      <circle cx="46"  cy="88" r="7.5"/><circle cx="64"  cy="88" r="7.5"/>

      <circle cx="106" cy="70" r="7.5"/><circle cx="124" cy="70" r="7.5"/>
      <circle cx="106" cy="88" r="7.5"/><circle cx="124" cy="88" r="7.5"/>

      <circle cx="166" cy="70" r="7.5"/><circle cx="184" cy="70" r="7.5"/>
      <circle cx="166" cy="88" r="7.5"/><circle cx="184" cy="88" r="7.5"/>
    </g>
  </g>

  <!-- And the two that would not go round again. The box is as wide as the
       plates above it, so the label sits inside rather than across its edge. -->
  <g>
    <rect x="28" y="122" width="174" height="40" rx="12" fill="none"
          stroke="#FB7185" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.9"/>
    <g fill="url(#divLeft)">
      <circle cx="52" cy="142" r="7.5"/>
      <circle cx="76" cy="142" r="7.5"/>
    </g>
    <text x="96" y="147" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12.5" font-weight="600" fill="#FDA4AF">left over</text>
  </g>

  <!-- The sentence the picture writes. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">
    <text x="236" y="88" font-size="28" fill="#BAE6FD">14 ÷ 3</text>
    <rect x="236" y="104" width="106" height="3" rx="1.5" fill="#3B3260"/>
    <text x="236" y="146" font-size="32" fill="url(#divAnswer)">4</text>
    <text x="264" y="146" font-size="20" fill="#8B84A8">r</text>
    <text x="283" y="146" font-size="32" fill="url(#divLeft)">2</text>
  </g>
</svg>
