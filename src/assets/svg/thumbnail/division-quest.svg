<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 200">
  <!--
    Division's card: fourteen shared between three plates, and two that would
    not go.

    A deal rather than a division sign, for the reason multiplication's card is
    an array: the picture should be the thing the skill teaches. The leftover is
    drawn, and drawn in its own colour, because it is what makes division
    different from the three operations before it — every other card on the
    shelf comes out even.

    The four colours are the skill's own and mean the same here as on screen:
    sky for what is being shared, violet for the groups it goes into, emerald
    for the answer, rose for what is left. No amber or yellow anywhere.
  -->
  <defs>
    <linearGradient id="divGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2440"/>
      <stop offset="100%" stop-color="#0B0F1F"/>
    </linearGradient>
    <linearGradient id="divCounter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="divLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="divAnswer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="divGlow" cx="34%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="200" fill="url(#divGround)"/>
  <ellipse cx="140" cy="96" rx="152" ry="108" fill="url(#divGlow)"/>

  <!-- Three plates, four on each. The equal share. -->
  <g>
    <g fill="none" stroke="#8B5CF6" stroke-width="2.5" opacity="0.85">
      <rect x="28"  y="40" width="62" height="62" rx="14"/>
      <rect x="100" y="40" width="62" height="62" rx="14"/>
      <rect x="172" y="40" width="62" height="62" rx="14"/>
    </g>
    <g fill="url(#divCounter)">
      <circle cx="47"  cy="59" r="9"/><circle cx="71"  cy="59" r="9"/>
      <circle cx="47"  cy="83" r="9"/><circle cx="71"  cy="83" r="9"/>

      <circle cx="119" cy="59" r="9"/><circle cx="143" cy="59" r="9"/>
      <circle cx="119" cy="83" r="9"/><circle cx="143" cy="83" r="9"/>

      <circle cx="191" cy="59" r="9"/><circle cx="215" cy="59" r="9"/>
      <circle cx="191" cy="83" r="9"/><circle cx="215" cy="83" r="9"/>
    </g>
  </g>

  <!-- And the two that would not go round again. -->
  <g>
    <rect x="28" y="122" width="134" height="46" rx="14" fill="none"
          stroke="#FB7185" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.9"/>
    <g fill="url(#divLeft)">
      <circle cx="60" cy="145" r="9"/>
      <circle cx="88" cy="145" r="9"/>
    </g>
    <text x="106" y="151" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#FDA4AF">left over</text>
  </g>

  <!-- The sentence the picture writes. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">
    <text x="262" y="74" font-size="30" fill="#BAE6FD">14 ÷ 3</text>
    <rect x="262" y="92" width="104" height="3" rx="1.5" fill="#334155"/>
    <text x="262" y="134" font-size="34" fill="url(#divAnswer)">4</text>
    <text x="292" y="134" font-size="22" fill="#64748B">r</text>
    <text x="312" y="134" font-size="34" fill="url(#divLeft)">2</text>
  </g>
</svg>
