<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="addGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0C1B33"/>
    </linearGradient>
    <linearGradient id="addPlus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="addSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <radialGradient id="addGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="200" rx="18" fill="url(#addGround)"/>
  <ellipse cx="200" cy="96" rx="150" ry="88" fill="url(#addGlow)"/>

  <!-- A ten-frame: the structure the whole skill is built on. Five filled and
       three more, which is the first thing it teaches you to see at a glance. -->
  <g transform="translate(38 62)">
    <rect x="-5" y="-5" width="146" height="82" rx="9" fill="#0F172A" fill-opacity="0.55" stroke="#334155" stroke-width="2"/>
    <g>
      <circle cx="14" cy="18" r="9" fill="url(#addPlus)"/>
      <circle cx="41" cy="18" r="9" fill="url(#addPlus)"/>
      <circle cx="68" cy="18" r="9" fill="url(#addPlus)"/>
      <circle cx="95" cy="18" r="9" fill="url(#addPlus)"/>
      <circle cx="122" cy="18" r="9" fill="url(#addPlus)"/>
      <circle cx="14" cy="54" r="9" fill="url(#addSky)"/>
      <circle cx="41" cy="54" r="9" fill="url(#addSky)"/>
      <circle cx="68" cy="54" r="9" fill="url(#addSky)"/>
      <circle cx="95" cy="54" r="9" fill="none" stroke="#475569" stroke-width="2"/>
      <circle cx="122" cy="54" r="9" fill="none" stroke="#475569" stroke-width="2"/>
    </g>
  </g>

  <!-- The plus, drawn big enough to be the thing you see first. -->
  <g transform="translate(232 100)">
    <rect x="-11" y="-42" width="22" height="84" rx="7" fill="url(#addPlus)"/>
    <rect x="-42" y="-11" width="84" height="22" rx="7" fill="url(#addPlus)"/>
    <rect x="-11" y="-42" width="22" height="84" rx="7" fill="none" stroke="#DDD6FE" stroke-width="1.5" opacity="0.5"/>
    <rect x="-42" y="-11" width="84" height="22" rx="7" fill="none" stroke="#DDD6FE" stroke-width="1.5" opacity="0.5"/>
  </g>

  <text x="322" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="60" font-weight="800" fill="#5EEAD4">8</text>

  <text x="200" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#E0E7FF">ADDITION QUEST</text>
</svg>
