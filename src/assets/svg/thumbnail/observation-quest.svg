<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 200">
  <!--
    Observation's card: a busy scene, one picture to match, and two of its three
    copies already found.

    A search rather than a beach, for the reason division's card is a deal: the
    picture should be the thing the skill teaches. The beach scene this replaces
    was one of twenty-eight backdrops and said nothing about looking closely —
    at 64px it was sand and sky.

    The rose star is the point of the picture. It is the right shape in the
    wrong colour, which is what separates matching from glancing, and it sits
    closest to the first match so the eye has to reject it.

    Ground, glow and title are the shelf's, set the way division and fractions
    set theirs. Colours mean what they mean on screen: sky for the target and
    its copies, emerald for a find, violet for the frame, rose and cyan for
    everything that is not it. No amber or yellow anywhere.
  -->
  <defs>
    <linearGradient id="obsGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#251A46"/>
      <stop offset="100%" stop-color="#100B24"/>
    </linearGradient>
    <linearGradient id="obsTarget" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="obsDecoy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="obsOther" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="obsFound" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="obsGlow" cx="34%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="200" fill="url(#obsGround)"/>
  <ellipse cx="138" cy="100" rx="152" ry="106" fill="url(#obsGlow)"/>

  <text x="28" y="34" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="15" font-weight="700" letter-spacing="3.4" fill="#DDD6FE">OBSERVATION</text>

  <!-- The scene. -->
  <rect x="28" y="50" width="184" height="120" rx="12" fill="#1A1236"
        stroke="#8B5CF6" stroke-width="2.5" opacity="0.85"/>

  <!-- Everything that is not the target. -->
  <g>
    <circle cx="150" cy="74" r="8" fill="url(#obsOther)"/>
    <path d="M0,-10 L9,7 L-9,7Z" transform="translate(188 78)" fill="url(#obsDecoy)"/>
    <rect x="-8" y="-8" width="16" height="16" rx="3" transform="translate(56 136) rotate(14)" fill="url(#obsOther)"/>
    <path d="M0,-10 L9,7 L-9,7Z" transform="translate(98 112) rotate(-12)" fill="url(#obsOther)"/>
    <circle cx="100" cy="152" r="7" fill="url(#obsDecoy)"/>
    <!-- Right shape, wrong colour. -->
    <path d="M0,-11 L2.7,-3.72 L10.46,-3.4 L4.37,1.42 L6.47,8.9 L0,4.6 L-6.47,8.9 L-4.37,1.42 L-10.46,-3.4 L-2.7,-3.72Z"
          transform="translate(104 74) rotate(18)" fill="url(#obsDecoy)"/>
  </g>

  <!-- The three copies: one found, one under the glass, one still waiting. -->
  <g fill="url(#obsTarget)">
    <path d="M0,-11 L2.7,-3.72 L10.46,-3.4 L4.37,1.42 L6.47,8.9 L0,4.6 L-6.47,8.9 L-4.37,1.42 L-10.46,-3.4 L-2.7,-3.72Z"
          transform="translate(60 80)"/>
    <path d="M0,-11 L2.7,-3.72 L10.46,-3.4 L4.37,1.42 L6.47,8.9 L0,4.6 L-6.47,8.9 L-4.37,1.42 L-10.46,-3.4 L-2.7,-3.72Z"
          transform="translate(142 124)"/>
    <path d="M0,-11 L2.7,-3.72 L10.46,-3.4 L4.37,1.42 L6.47,8.9 L0,4.6 L-6.47,8.9 L-4.37,1.42 L-10.46,-3.4 L-2.7,-3.72Z"
          transform="translate(190 146)"/>
  </g>
  <circle cx="60" cy="80" r="16" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-width="2.5"/>

  <!-- The glass, over the second find. -->
  <g>
    <line x1="158" y1="140" x2="174" y2="156" stroke="#DDD6FE" stroke-width="6" stroke-linecap="round"/>
    <circle cx="142" cy="124" r="21" fill="#34D399" fill-opacity="0.14" stroke="#DDD6FE" stroke-width="4"/>
    <circle cx="142" cy="124" r="15" fill="none" stroke="#34D399" stroke-width="2.5"/>
  </g>

  <!-- The picture to match, and how far along the hunt is. -->
  <rect x="240" y="50" width="78" height="78" rx="14" fill="#1A1236"
        stroke="#7DD3FC" stroke-width="2.5" stroke-dasharray="7 6" opacity="0.9"/>
  <path d="M0,-11 L2.7,-3.72 L10.46,-3.4 L4.37,1.42 L6.47,8.9 L0,4.6 L-6.47,8.9 L-4.37,1.42 L-10.46,-3.4 L-2.7,-3.72Z"
        transform="translate(279 90) scale(2.4)" fill="url(#obsTarget)"/>
  <text x="240" y="148" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="12.5" font-weight="600" fill="#BAE6FD">find this</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">
    <text x="240" y="178" font-size="28" fill="url(#obsFound)">2</text>
    <text x="264" y="178" font-size="22" fill="#8B84A8">/ 3</text>
  </g>
</svg>
