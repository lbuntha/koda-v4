<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="subGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A1B4B"/>
      <stop offset="100%" stop-color="#120C2B"/>
    </linearGradient>
    <linearGradient id="subMinus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="55%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="subWhole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="subLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="subGlow" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="200" rx="18" fill="url(#subGround)"/>
  <ellipse cx="200" cy="96" rx="152" ry="88" fill="url(#subGlow)"/>

  <!-- Seven counters: four still whole, three struck through. The picture is
       the skill's one idea — a group that started bigger than it ended, with
       what left still visible so the change can be audited rather than assumed. -->
  <g>
    <circle cx="64" cy="88" r="16" fill="url(#subWhole)"/>
    <circle cx="104" cy="88" r="16" fill="url(#subWhole)"/>
    <circle cx="144" cy="88" r="16" fill="url(#subWhole)"/>
    <circle cx="184" cy="88" r="16" fill="url(#subWhole)"/>
  </g>
  <g opacity="0.42">
    <circle cx="224" cy="88" r="16" fill="#F43F5E"/>
    <circle cx="264" cy="88" r="16" fill="#F43F5E"/>
    <circle cx="304" cy="88" r="16" fill="#F43F5E"/>
  </g>
  <g stroke="#FB7185" stroke-width="5" stroke-linecap="round">
    <line x1="212" y1="100" x2="236" y2="76"/>
    <line x1="252" y1="100" x2="276" y2="76"/>
    <line x1="292" y1="100" x2="316" y2="76"/>
  </g>

  <!-- The minus sign, given the weight the plus has on Addition's card. -->
  <rect x="150" y="128" width="52" height="13" rx="6.5" fill="url(#subMinus)"/>

  <!-- What remains: the answer the whole skill is pointed at. -->
  <g>
    <rect x="222" y="122" width="26" height="26" rx="7" fill="url(#subLeft)"/>
    <rect x="256" y="122" width="26" height="26" rx="7" fill="url(#subLeft)"/>
    <rect x="290" y="122" width="26" height="26" rx="7" fill="url(#subLeft)"/>
    <rect x="324" y="122" width="26" height="26" rx="7" fill="url(#subLeft)"/>
  </g>

  <g fill="#E9D5FF" font-family="system-ui, sans-serif" font-weight="700">
    <text x="64" y="40" font-size="19" letter-spacing="2.5">SUBTRACTION</text>
    <text x="64" y="176" font-size="12" opacity="0.72">Take away · Compare · Find the missing part</text>
  </g>
</svg>
