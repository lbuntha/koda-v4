<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 500 500">
  <defs>
    <!-- Stem & Leaf Gradient -->
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="50%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>

    <linearGradient id="leaf-grad-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20" />
      <stop offset="50%" stop-color="#388e3c" />
      <stop offset="100%" stop-color="#81c784" />
    </linearGradient>

    <linearGradient id="leaf-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="50%" stop-color="#388e3c" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>

    <!-- Petal Gradients -->
    <linearGradient id="petal-back" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e65100" />
      <stop offset="25%" stop-color="#f57c00" />
      <stop offset="100%" stop-color="#ffca28" />
    </linearGradient>

    <linearGradient id="petal-front" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6f00" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="90%" stop-color="#ffee58" />
      <stop offset="100%" stop-color="#fffde7" />
    </linearGradient>

    <!-- Center Seed Disc Gradients -->
    <radialGradient id="center-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#211003" />
      <stop offset="60%" stop-color="#3e2723" />
      <stop offset="85%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#8d6e63" />
    </radialGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6f00" stop-opacity="0" />
      <stop offset="80%" stop-color="#ff6f00" stop-opacity="0.1" />
      <stop offset="95%" stop-color="#ffab00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0" />
    </radialGradient>

    <!-- Reusable Petal Shapes -->
    <path id="petal-shape-1" d="M 0,0 C -18,-50 -22,-120 0,-165 C 22,-120 18,-50 0,0 Z" />
    <path id="petal-shape-2" d="M 0,0 C -12,-40 -15,-95 0,-145 C 15,-95 12,-40 0,0 Z" />
  </defs>

  <!-- Stem -->
  <path d="M 250,210 Q 245,340 230,500" fill="none" stroke="url(#stem-grad)" stroke-width="16" stroke-linecap="round" />

  <!-- Leaves -->
  <g>
    <!-- Left Leaf -->
    <path d="M 242,360 C 170,350 100,290 80,300 C 60,310 90,380 170,390 C 210,395 236,375 242,360 Z" fill="url(#leaf-grad-left)" />
    <path d="M 242,360 C 190,355 130,330 80,300" fill="none" stroke="#a5d6a7" stroke-width="2" opacity="0.5" />
    
    <!-- Right Leaf -->
    <path d="M 236,410 C 310,400 390,350 410,365 C 430,380 380,440 300,440 C 260,440 242,420 236,410 Z" fill="url(#leaf-grad-right)" />
    <path d="M 236,410 C 290,405 350,385 410,365" fill="none" stroke="#a5d6a7" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Flower Head Group (Centered at X:250, Y:210) -->
  <g transform="translate(250, 210)">
    
    <!-- Outer/Back Petal Ring (18 Petals) -->
    <g fill="url(#petal-back)">
      <use href="#petal-shape-1" transform="rotate(0)" />
      <use href="#petal-shape-1" transform="rotate(20)" />
      <use href="#petal-shape-1" transform="rotate(40)" />
      <use href="#petal-shape-1" transform="rotate(60)" />
      <use href="#petal-shape-1" transform="rotate(80)" />
      <use href="#petal-shape-1" transform="rotate(100)" />
      <use href="#petal-shape-1" transform="rotate(120)" />
      <use href="#petal-shape-1" transform="rotate(140)" />
      <use href="#petal-shape-1" transform="rotate(160)" />
      <use href="#petal-shape-1" transform="rotate(180)" />
      <use href="#petal-shape-1" transform="rotate(200)" />
      <use href="#petal-shape-1" transform="rotate(220)" />
      <use href="#petal-shape-1" transform="rotate(240)" />
      <use href="#petal-shape-1" transform="rotate(260)" />
      <use href="#petal-shape-1" transform="rotate(280)" />
      <use href="#petal-shape-1" transform="rotate(300)" />
      <use href="#petal-shape-1" transform="rotate(320)" />
      <use href="#petal-shape-1" transform="rotate(340)" />
    </g>

    <!-- Inner/Front Petal Ring (18 Petals Offset by 10 deg) -->
    <g fill="url(#petal-front)">
      <use href="#petal-shape-2" transform="rotate(10)" />
      <use href="#petal-shape-2" transform="rotate(30)" />
      <use href="#petal-shape-2" transform="rotate(50)" />
      <use href="#petal-shape-2" transform="rotate(70)" />
      <use href="#petal-shape-2" transform="rotate(90)" />
      <use href="#petal-shape-2" transform="rotate(110)" />
      <use href="#petal-shape-2" transform="rotate(130)" />
      <use href="#petal-shape-2" transform="rotate(150)" />
      <use href="#petal-shape-2" transform="rotate(170)" />
      <use href="#petal-shape-2" transform="rotate(190)" />
      <use href="#petal-shape-2" transform="rotate(210)" />
      <use href="#petal-shape-2" transform="rotate(230)" />
      <use href="#petal-shape-2" transform="rotate(250)" />
      <use href="#petal-shape-2" transform="rotate(270)" />
      <use href="#petal-shape-2" transform="rotate(290)" />
      <use href="#petal-shape-2" transform="rotate(310)" />
      <use href="#petal-shape-2" transform="rotate(330)" />
      <use href="#petal-shape-2" transform="rotate(350)" />
    </g>

    <!-- Center Seed Disc -->
    <circle cx="0" cy="0" r="62" fill="url(#center-base)" stroke="#5d4037" stroke-width="3" />
    <circle cx="0" cy="0" r="62" fill="url(#center-glow)" />

    <!-- Center Seed Pattern Details -->
    <g fill="#ffb300" opacity="0.6">
      <!-- Outer Seed Ring -->
      <circle cx="0" cy="-54" r="2.5" /><circle cx="20" cy="-50" r="2.5" /><circle cx="38" cy="-38" r="2.5" /><circle cx="50" cy="-20" r="2.5" />
      <circle cx="54" cy="0" r="2.5" /><circle cx="50" cy="20" r="2.5" /><circle cx="38" cy="38" r="2.5" /><circle cx="20" cy="50" r="2.5" />
      <circle cx="0" cy="54" r="2.5" /><circle cx="-20" cy="50" r="2.5" /><circle cx="-38" cy="38" r="2.5" /><circle cx="-50" cy="20" r="2.5" />
      <circle cx="-54" cy="0" r="2.5" /><circle cx="-50" cy="-20" r="2.5" /><circle cx="-38" cy="-38" r="2.5" /><circle cx="-20" cy="-50" r="2.5" />
      
      <!-- Middle Seed Ring -->
      <circle cx="0" cy="-38" r="2" /><circle cx="14" cy="-35" r="2" /><circle cx="26" cy="-26" r="2" /><circle cx="35" cy="-14" r="2" />
      <circle cx="38" cy="0" r="2" /><circle cx="35" cy="14" r="2" /><circle cx="26" cy="26" r="2" /><circle cx="14" cy="35" r="2" />
      <circle cx="0" cy="38" r="2" /><circle cx="-14" cy="35" r="2" /><circle cx="-26" cy="26" r="2" /><circle cx="-35" cy="14" r="2" />
      <circle cx="-38" cy="0" r="2" /><circle cx="-35" cy="-14" r="2" /><circle cx="-26" cy="-26" r="2" /><circle cx="-14" cy="-35" r="2" />

      <!-- Inner Seed Ring -->
      <circle cx="0" cy="-22" r="1.5" /><circle cx="8" cy="-20" r="1.5" /><circle cx="15" cy="-15" r="1.5" /><circle cx="20" cy="-8" r="1.5" />
      <circle cx="22" cy="0" r="1.5" /><circle cx="20" cy="8" r="1.5" /><circle cx="15" cy="15" r="1.5" /><circle cx="8" cy="20" r="1.5" />
      <circle cx="0" cy="22" r="1.5" /><circle cx="-8" cy="20" r="1.5" /><circle cx="-15" cy="15" r="1.5" /><circle cx="-20" cy="8" r="1.5" />
      <circle cx="-22" cy="0" r="1.5" /><circle cx="-20" cy="-8" r="1.5" /><circle cx="-15" cy="-15" r="1.5" /><circle cx="-8" cy="-20" r="1.5" />
    </g>

    <!-- Center Soft Highlight Rim -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#ffa000" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,8" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#8d6e63" stroke-width="2" opacity="0.5" stroke-dasharray="6,6" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#d7ccc8" stroke-width="1" opacity="0.3" />
  </g>
</svg>
