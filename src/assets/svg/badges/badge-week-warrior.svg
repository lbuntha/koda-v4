<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Week Warrior badge</title>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.5" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <!-- Handles behind the cup. These are geometry drawn as strokes rather than
         outlines, so they stay — thicker than a real trophy's, because a 2px
         wire is gone by 20px. -->
    <path d="M28,20 C13,20 7,32 15,43 C19,48 24,51 30,52" fill="none"
      stroke="url(#gold)" stroke-width="9" stroke-linecap="round" />
    <path d="M72,20 C87,20 93,32 85,43 C81,48 76,51 70,52" fill="none"
      stroke="url(#gold)" stroke-width="9" stroke-linecap="round" />

    <!-- Foot, then stem, then cup: back to front, so each overlaps cleanly. -->
    <path d="M24,80 H76 V93 H24 Z" fill="url(#gold)" />
    <path d="M24,80 H76 V85 H24 Z" fill="url(#bevel)" />
    <path d="M33,70 H67 V80 H33 Z" fill="url(#gold)" />
    <path d="M44,58 H56 V71 H44 Z" fill="url(#gold)" />
    <path d="M50,58 H56 V71 H50 Z" fill="url(#facet)" />

    <path d="M27,12 H73 V37 C73,53 62,63 50,63 C38,63 27,53 27,37 Z" fill="url(#gold)" />
    <path d="M27,12 H73 V37 C73,45 68,51 61,50 C44,47 33,32 27,12 Z" fill="url(#bevel)" />
    <path d="M73,37 C73,53 62,63 50,63 C38,63 27,53 27,37 C40,49 58,48 73,37 Z" fill="url(#facet)" />
    <!-- A star on the cup, borrowed from the two star badges: the one motif the
         collection repeats, so the six look like they were drawn together. -->
    <polygon points="50,21 53.2,29.6 62.4,30 55.2,35.7 57.6,44.5 50,39.5 42.4,44.5 44.8,35.7 37.6,30 46.8,29.6"
      fill="#FEF3C7" fill-opacity="0.92" stroke-linejoin="round" />
  </g>
</svg>
