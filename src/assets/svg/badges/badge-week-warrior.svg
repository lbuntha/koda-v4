<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Week Warrior badge</title>
  <defs>
    <linearGradient id="gold" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D2" />
      <stop offset="34%" stop-color="#F9CE4B" />
      <stop offset="72%" stop-color="#E0A210" />
      <stop offset="100%" stop-color="#B87503" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7C4A02" flood-opacity="0.42" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <!-- Handles behind the cup, drawn as an outlined stroke over a darker one
         so they carry the same rim every other shape here has. Thicker than a
         real trophy's, because a 2px wire is gone by 20px. -->
    <path d="M28,20 C13,20 7,32 15,43 C19,48 24,51 30,52" fill="none"
      stroke="#8A5A05" stroke-width="11" stroke-linecap="round" />
    <path d="M72,20 C87,20 93,32 85,43 C81,48 76,51 70,52" fill="none"
      stroke="#8A5A05" stroke-width="11" stroke-linecap="round" />
    <path d="M28,20 C13,20 7,32 15,43 C19,48 24,51 30,52" fill="none"
      stroke="url(#gold)" stroke-width="7" stroke-linecap="round" />
    <path d="M72,20 C87,20 93,32 85,43 C81,48 76,51 70,52" fill="none"
      stroke="url(#gold)" stroke-width="7" stroke-linecap="round" />

    <!-- Foot, then stem, then cup: back to front, so each overlaps cleanly. -->
    <path d="M24,80 H76 V93 H24 Z" fill="url(#gold)" stroke="#8A5A05" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M33,70 H67 V80 H33 Z" fill="url(#gold)" stroke="#8A5A05" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M44,58 H56 V71 H44 Z" fill="url(#gold)" stroke="#8A5A05" stroke-width="2.4" stroke-linejoin="round" />

    <path d="M27,12 H73 V37 C73,53 62,63 50,63 C38,63 27,53 27,37 Z"
      fill="url(#gold)" stroke="#8A5A05" stroke-width="2.6" stroke-linejoin="round" />
    <path d="M27,12 H73 V37 C73,53 62,63 50,63 C38,63 27,53 27,37 Z" fill="url(#sheen)" />
    <!-- A star on the cup, borrowed from the two star badges: the one motif the
         collection repeats, so the six look like they were drawn together. -->
    <polygon points="50,21 53.2,29.6 62.4,30 55.2,35.7 57.6,44.5 50,39.5 42.4,44.5 44.8,35.7 37.6,30 46.8,29.6"
      fill="#FFF6D2" stroke="#C98A0E" stroke-width="1.3" stroke-linejoin="round" />
  </g>
</svg>
