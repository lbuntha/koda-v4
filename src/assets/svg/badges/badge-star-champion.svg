<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Star Champion badge</title>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <!-- The disc is domed rather than flat-lit: a radial with the highlight
         off-centre to the top-left, which is where every other badge here is
         lit from. -->
    <radialGradient id="dome" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.5" />
    </linearGradient>
    <!-- The ribbon is the one non-gold note, so the medal is not a coin. -->
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6BE8" />
      <stop offset="100%" stop-color="#5B3BC4" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <path d="M28,5 L47,45 L58,39 L42,5 Z" fill="url(#ribbon)" stroke-linejoin="round" />
    <path d="M72,5 L53,45 L42,39 L58,5 Z" fill="url(#ribbon)" stroke-linejoin="round" />
    <path d="M72,5 L53,45 L42,39 L58,5 Z" fill="url(#facet)" />

    <circle cx="50" cy="66" r="28" fill="url(#dome)" />
    <path d="M50,38 A28,28 0 0,0 27,79 C30,58 43,45 50,38 Z" fill="url(#bevel)" />
    <polygon points="50,49 54.6,62.2 68.6,62.6 57.6,71.6 61.4,85 50,77 38.6,85 42.4,71.6 31.4,62.6 45.4,62.2"
      fill="#FEF3C7" fill-opacity="0.95" stroke-linejoin="round" />
  </g>
</svg>
