<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Star Champion badge</title>
  <defs>
    <linearGradient id="gold" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D2" />
      <stop offset="34%" stop-color="#F9CE4B" />
      <stop offset="72%" stop-color="#E0A210" />
      <stop offset="100%" stop-color="#B87503" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <!-- The disc is domed rather than flat-lit: a radial with the highlight
         off-centre to the top-left, which is where every other badge here is
         lit from. -->
    <radialGradient id="dome" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="45%" stop-color="#F5C43C" />
      <stop offset="100%" stop-color="#B87503" />
    </radialGradient>
    <!-- The ribbon is the one non-gold note, so the medal is not a coin. -->
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6BE8" />
      <stop offset="100%" stop-color="#5B3BC4" />
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7C4A02" flood-opacity="0.42" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <path d="M28,5 L47,45 L58,39 L42,5 Z" fill="url(#ribbon)" stroke="#43299B" stroke-width="2" stroke-linejoin="round" />
    <path d="M72,5 L53,45 L42,39 L58,5 Z" fill="url(#ribbon)" stroke="#43299B" stroke-width="2" stroke-linejoin="round" />

    <circle cx="50" cy="66" r="28" fill="url(#dome)" stroke="#8A5A05" stroke-width="2.6" />
    <circle cx="50" cy="66" r="22" fill="none" stroke="#B87503" stroke-width="1.6" stroke-opacity="0.55" />
    <polygon points="50,49 54.6,62.2 68.6,62.6 57.6,71.6 61.4,85 50,77 38.6,85 42.4,71.6 31.4,62.6 45.4,62.2"
      fill="#FFF3C4" stroke="#C98A0E" stroke-width="1.4" stroke-linejoin="round" />
    <ellipse cx="39" cy="53" rx="8" ry="5" fill="#FFFFFF" fill-opacity="0.40" transform="rotate(-30 39 53)" />
  </g>
</svg>
