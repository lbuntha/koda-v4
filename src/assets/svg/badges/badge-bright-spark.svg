<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Bright Spark badge</title>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.5" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <!-- Chunkier than a signage bolt: a thin zig-zag loses its shape at 20px. -->
    <path d="M62,4 L26,53 L46,53 L38,96 L76,43 L55,43 Z" fill="url(#gold)" stroke-linejoin="round" />
    <!-- The upper limb catches the light; the lower one is turned away. -->
    <path d="M62,4 L26,53 L46,53 L50,49 L55,43 Z" fill="url(#bevel)" />
    <path d="M46,53 L38,96 L76,43 L55,43 L50,49 Z" fill="url(#facet)" />

    <!-- Two sparks, so "spark" is in the drawing and not only in the name. -->
    <circle cx="82" cy="20" r="4" fill="url(#gold)" />
    <circle cx="19" cy="78" r="3.2" fill="url(#gold)" />
  </g>
</svg>
