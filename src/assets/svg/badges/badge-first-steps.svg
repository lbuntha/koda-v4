<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>First Steps badge</title>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.5" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <!-- One large four-point sparkle and two small ones. The big one carries
         the badge at 20px; the small pair only has to survive at 50. -->
    <path d="M42,7 Q46,35 78,42 Q46,49 42,79 Q38,49 6,42 Q38,35 42,7 Z" fill="url(#gold)" stroke-linejoin="round" />
    <path d="M42,7 Q46,35 78,42 Q46,45 42,43 Q38,45 6,42 Q38,35 42,7 Z" fill="url(#bevel)" />
    <path d="M78,42 Q46,49 42,79 Q38,49 6,42 Q38,45 42,43 Q46,45 78,42 Z" fill="url(#facet)" />

    <path d="M78,60 Q80,72 93,75 Q80,78 78,90 Q76,78 63,75 Q76,72 78,60 Z" fill="url(#gold)" stroke-linejoin="round" />
    <path d="M78,60 Q80,72 93,75 Q80,76 78,75.5 Q76,76 63,75 Q76,72 78,60 Z" fill="url(#bevel)" />

    <path d="M79,10 Q80,17 88,19 Q80,21 79,28 Q78,21 70,19 Q78,17 79,10 Z" fill="url(#gold)" stroke-linejoin="round" />
  </g>
</svg>
