<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>First Steps badge</title>
  <defs>
    <linearGradient id="gold" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D2" />
      <stop offset="34%" stop-color="#F9CE4B" />
      <stop offset="72%" stop-color="#E0A210" />
      <stop offset="100%" stop-color="#B87503" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7C4A02" flood-opacity="0.42" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <!-- One large four-point sparkle and two small ones. The big one carries
         the badge at 20px; the small pair only has to survive at 50. -->
    <path d="M42,7 Q46,35 78,42 Q46,49 42,79 Q38,49 6,42 Q38,35 42,7 Z"
      fill="url(#gold)" stroke="#8A5A05" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M42,7 Q46,35 78,42 Q46,49 42,79 Q38,49 6,42 Q38,35 42,7 Z" fill="url(#sheen)" />

    <path d="M78,60 Q80,72 93,75 Q80,78 78,90 Q76,78 63,75 Q76,72 78,60 Z"
      fill="url(#gold)" stroke="#8A5A05" stroke-width="2" stroke-linejoin="round" />
    <path d="M78,60 Q80,72 93,75 Q80,78 78,90 Q76,78 63,75 Q76,72 78,60 Z" fill="url(#sheen)" />

    <path d="M79,10 Q80,17 88,19 Q80,21 79,28 Q78,21 70,19 Q78,17 79,10 Z"
      fill="url(#gold)" stroke="#8A5A05" stroke-width="1.8" stroke-linejoin="round" />
  </g>
</svg>
