<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Three in a Row badge</title>
  <defs>
    <linearGradient id="gold" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D2" />
      <stop offset="34%" stop-color="#F9CE4B" />
      <stop offset="72%" stop-color="#E0A210" />
      <stop offset="100%" stop-color="#B87503" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <!-- The inner tongue: a flame reads as a flame because it has a second,
         hotter core, not because the outline is fancier. -->
    <linearGradient id="core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#FFD34E" />
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7C4A02" flood-opacity="0.42" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <path d="M50,5 C62,25 74,33 74,55 C74,76 63,94 50,94 C37,94 26,78 26,57 C26,42 35,33 41,22 C42,35 47,41 51,45 C56,36 53,20 50,5 Z"
      fill="url(#gold)" stroke="#8A5A05" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M50,5 C62,25 74,33 74,55 C74,76 63,94 50,94 C37,94 26,78 26,57 C26,42 35,33 41,22 C42,35 47,41 51,45 C56,36 53,20 50,5 Z"
      fill="url(#sheen)" />
    <!-- The inner tongue repeats the outline's notch. Without it this is a
         smooth teardrop with a highlight on it, which reads as water, not
         fire — the notch is the whole difference between the two. -->
    <path d="M51,44 C54,57 61,65 61,74 C61,84 55,90 49,90 C43,90 38,83 38,74 C38,66 43,60 46,51 C47,57 49,60 51,62 C53,57 52,49 51,44 Z"
      fill="url(#core)" fill-opacity="0.95" />
  </g>
</svg>
