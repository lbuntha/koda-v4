<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Three in a Row badge</title>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <!-- The inner tongue: a flame reads as a flame because it has a second,
         hotter core, not because the outline is fancier. -->
    <linearGradient id="core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <path d="M50,5 C62,25 74,33 74,55 C74,76 63,94 50,94 C37,94 26,78 26,57 C26,42 35,33 41,22 C42,35 47,41 51,45 C56,36 53,20 50,5 Z"
      fill="url(#gold)" stroke-linejoin="round" />
    <path d="M50,5 C62,25 74,33 74,55 C74,76 63,94 50,94 C37,94 26,78 26,57 C26,42 35,33 41,22 C42,35 47,41 51,45 C56,36 53,20 50,5 Z"
      fill="url(#bevel)" />
    <!-- The inner tongue repeats the outline's notch. Without it this is a
         smooth teardrop with a highlight on it, which reads as water, not
         fire — the notch is the whole difference between the two. -->
    <path d="M51,44 C54,57 61,65 61,74 C61,84 55,90 49,90 C43,90 38,83 38,74 C38,66 43,60 46,51 C47,57 49,60 51,62 C53,57 52,49 51,44 Z"
      fill="url(#core)" fill-opacity="0.95" />
  </g>
</svg>
