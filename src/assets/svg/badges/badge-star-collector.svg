<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Star Collector badge</title>
  <defs>
    <!-- The collection's gold ramp, shared with `points` and `star`: lit from
         the top-left, no outline. What rounds these shapes is the bevel and the
         shadow facet, not a dark rim. -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <!-- The lit face: the same silhouette in fading white. -->
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <!-- The turned-away face. A facet in shadow is what makes the surface read
         as folded rather than printed. -->
    <linearGradient id="facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.5" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <polygon points="50,10 60.6,37.4 90,39 67.1,57.6 74.7,86 50,70 25.3,86 32.9,57.6 10,39 39.4,37.4"
      fill="url(#gold)" stroke-linejoin="round" />
    <!-- Lit half: up the left points and across the top. -->
    <polygon points="50,10 60.6,37.4 90,39 67.1,57.6 50,52 32.9,57.6 10,39 39.4,37.4"
      fill="url(#bevel)" />
    <!-- Shadowed half: the lower right, away from the light. -->
    <polygon points="67.1,57.6 74.7,86 50,70 25.3,86 32.9,57.6 50,52"
      fill="url(#facet)" />
  </g>
</svg>
