<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Star Collector badge</title>
  <defs>
    <!-- The collection's one gold ramp. Every badge in this folder uses these
         four stops in this order, lit from the top-left, so the six read as a
         set rather than as six drawings that happen to be yellow. -->
    <linearGradient id="gold" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D2" />
      <stop offset="34%" stop-color="#F9CE4B" />
      <stop offset="72%" stop-color="#E0A210" />
      <stop offset="100%" stop-color="#B87503" />
    </linearGradient>
    <!-- Sheen: the same silhouette drawn again in fading white, which is what
         turns a flat gradient into a rounded surface. -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7C4A02" flood-opacity="0.42" />
    </filter>
  </defs>

  <g filter="url(#lift)">
    <polygon points="50,10 60.6,37.4 90,39 67.1,57.6 74.7,86 50,70 25.3,86 32.9,57.6 10,39 39.4,37.4"
      fill="url(#gold)" stroke="#8A5A05" stroke-width="2.4" stroke-linejoin="round" />
    <polygon points="50,10 60.6,37.4 90,39 67.1,57.6 74.7,86 50,70 25.3,86 32.9,57.6 10,39 39.4,37.4"
      fill="url(#sheen)" />
    <!-- Specular: one small catchlight where the light source is. -->
    <ellipse cx="42" cy="28" rx="7" ry="4" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-28 42 28)" />
  </g>
</svg>
