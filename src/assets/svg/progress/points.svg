<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Total points</title>
  <defs>
    <!-- Base Gradient (Gold) -->
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Top Highlight Gradient (3D Light Effect) -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Shadow Gradient (3D Depth Effect) -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.5" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Base Shape -->
    <path fill="url(#baseGradient)" d="
      M 56,18
      C 56,18 36,50 35,51
      C 34.2,52.2 35,54 36.5,54
      H 47
      L 44,80
      C 43.7,82 46.2,83 47.4,81.4
      L 67,49
      C 67.8,47.8 67,46 65.5,46
      H 54
      L 58,20
      C 58.3,18 55.8,17 54.6,18.6
      Z"
      stroke-linejoin="round"
    />

    <!-- 3D Bevel Highlight Layer -->
    <path fill="url(#highlightGradient)" d="
      M 56,18
      L 35,51
      H 47
      L 44,80
      L 50,48
      H 54
      Z"
    />

    <!-- 3D Dark Shadow Edge -->
    <path fill="url(#shadowGradient)" d="
      M 47,54
      L 44,80
      L 67,49
      H 54
      L 58,20
      Z"
    />
  </g>
</svg>
