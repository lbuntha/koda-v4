<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Total points</title>
  <!--
    A bolt, drawn in one colour.

    Same rule as the flame beside it: `currentColor` only, so the tone comes from
    the wrapper and the mark reads correctly on light and dark without a hue of
    its own. The faint ring is the same shape offset, not a second colour.
  -->
  <g fill="currentColor">
    <circle cx="50" cy="50" r="40" opacity="0.14" />
    <path d="M56 10 26 56h18l-6 34 32-48H51l5-32z" fill-rule="evenodd" />
  </g>
</svg>
