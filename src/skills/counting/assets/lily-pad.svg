<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="padFill" cx="38%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="45%" stop-color="#34D399"/>
      <stop offset="78%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
    <radialGradient id="padWater" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The water it floats on -->
  <ellipse cx="64" cy="88" rx="50" ry="16" fill="url(#padWater)"/>

  <!--
    The pad: a disc with a wedge taken out of the bottom, which is the shape
    that makes a lily pad read as a lily pad rather than as a green circle.
    Drawn as one path — arc the long way round, then two edges back to centre.
  -->
  <path d="M 56.4 107.3 A 44 44 0 1 1 71.6 107.3 L 64 64 Z" fill="url(#padFill)"/>

  <!-- Veins, stopping short of the notch -->
  <g stroke="#DCFCE7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 64 64 L 64 22"/>
    <path d="M 64 64 L 34 34"/>
    <path d="M 64 64 L 94 34"/>
    <path d="M 64 64 L 21 62"/>
    <path d="M 64 64 L 107 62"/>
    <path d="M 64 64 L 33 92"/>
    <path d="M 64 64 L 95 92"/>
  </g>

  <!-- Rim and a wet highlight -->
  <path d="M 56.4 107.3 A 44 44 0 1 1 71.6 107.3" stroke="#166534" stroke-width="2" fill="none" opacity="0.35"/>
  <path d="M 38 42 C 50 32 78 32 90 42" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>
