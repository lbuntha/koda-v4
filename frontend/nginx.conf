server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls are proxied to the backend container (trailing slash strips /api/).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disable caching for index.html so browser updates immediately on build
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Same for the service worker and its manifest: a cached worker keeps serving the
    # old precache, so the app could never notice a deploy.
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        expires -1;
    }

    # SPA fallback — every other route serves the built index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
