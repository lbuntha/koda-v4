<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 56 400 400" role="img" aria-labelledby="title description">
  <title id="title">Count to 10</title>
  <desc id="description">Ten colorful stars arranged around the number ten.</desc>
  <!-- Transparent background on purpose: the student hero and every thumbnail chip
       supply their own white surface, so a baked tile would read as a second card.
       viewBox is cropped to the artwork so the subject fills the frame. -->
  <defs>
    <linearGradient id="ten" x1="170" y1="154" x2="348" y2="361" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B86FF"/>
      <stop offset="1" stop-color="#7A5CF0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5C46B8" flood-opacity=".22"/>
    </filter>
    <symbol id="star" viewBox="-18 -18 36 36">
      <path d="M0-16 4.7-5.4 16-4.8 7.4 2.6 10 14 0 8.1-10 14l2.6-11.4L-16-4.8l11.3-.6Z"/>
    </symbol>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Generic font stack: this art renders inside <img>, where a macOS-only family
         would silently fall back and shift the numerals on other platforms. -->
    <text x="256" y="329" fill="url(#ten)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="214" font-weight="800" text-anchor="middle">10</text>
  </g>

  <!-- Rims are light lilac, not white: a pure white outline vanishes once the
       artwork is composited onto a white card. -->
  <g stroke="#EFEAFF" stroke-width="3" stroke-linejoin="round">
    <use href="#star" x="116" y="102" width="36" height="36" fill="#FFBE3F" transform="rotate(-12 134 120)"/>
    <use href="#star" x="229" y="61" width="36" height="36" fill="#FF7EAE" transform="rotate(8 247 79)"/>
    <use href="#star" x="351" y="91" width="36" height="36" fill="#55D7B1" transform="rotate(16 369 109)"/>
    <use href="#star" x="406" y="189" width="36" height="36" fill="#7C65F5" transform="rotate(-8 424 207)"/>
    <use href="#star" x="390" y="314" width="36" height="36" fill="#FF9B4A" transform="rotate(12 408 332)"/>
    <use href="#star" x="318" y="402" width="36" height="36" fill="#4ABDEB" transform="rotate(-15 336 420)"/>
    <use href="#star" x="190" y="414" width="36" height="36" fill="#FFCA3D" transform="rotate(9 208 432)"/>
    <use href="#star" x="88" y="346" width="36" height="36" fill="#F16BB5" transform="rotate(-11 106 364)"/>
    <use href="#star" x="65" y="223" width="36" height="36" fill="#63D69C" transform="rotate(14 83 241)"/>
    <use href="#star" x="300" y="121" width="30" height="30" fill="#FFD65A" transform="rotate(-4 315 136)"/>
  </g>

  <g fill="#CFC4FF">
    <circle cx="82" cy="154" r="7"/>
    <circle cx="431" cy="274" r="6"/>
    <circle cx="147" cy="414" r="5"/>
    <circle cx="395" cy="153" r="4"/>
  </g>
</svg>
