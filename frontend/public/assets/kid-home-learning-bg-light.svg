<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" fill="none">
  <defs>
    <radialGradient id="washA" cx="0" cy="0" r="1" gradientTransform="translate(190 150) rotate(36) scale(430 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7DEFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E7DEFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washB" cx="0" cy="0" r="1" gradientTransform="translate(1430 350) rotate(132) scale(410 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDF5FF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#DDF5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9A7CF4"/>
      <stop offset="1" stop-color="#6B4DDA"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="#F7F9FE"/>
  <rect width="1600" height="1100" fill="url(#washA)"/>
  <rect width="1600" height="1100" fill="url(#washB)"/>

  <!-- Left counting constellation -->
  <g opacity=".42">
    <path d="M42 232C112 181 164 220 209 174C248 134 221 91 285 61" stroke="#A58CEF" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 13"/>
    <circle cx="44" cy="232" r="10" fill="#FFCB4C"/>
    <circle cx="123" cy="199" r="8" fill="#65CFA5"/>
    <circle cx="209" cy="174" r="9" fill="#70B8F2"/>
    <circle cx="285" cy="61" r="12" fill="#A58CEF"/>
    <circle cx="44" cy="232" r="22" fill="#FFCB4C" opacity=".15" filter="url(#soft)"/>
  </g>

  <!-- Friendly numbers -->
  <g fill="url(#violet)" opacity=".24" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800">
    <text x="52" y="104" font-size="58">1</text>
    <text x="112" y="93" font-size="42">2</text>
    <text x="1520" y="175" font-size="48">3</text>
    <text x="23" y="775" font-size="54">8</text>
  </g>

  <!-- Geometry at the right edge -->
  <g opacity=".27" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1500 238 1553 328h-106l53-90Z" stroke="#7F62DF" stroke-width="6"/>
    <circle cx="1464" cy="424" r="43" stroke="#55B9DE" stroke-width="6"/>
    <rect x="1512" y="480" width="70" height="70" rx="14" transform="rotate(12 1512 480)" stroke="#79C892" stroke-width="6"/>
  </g>

  <!-- Math marks -->
  <g opacity=".28" stroke="#7657E8" stroke-width="7" stroke-linecap="round">
    <path d="M73 411h45M95.5 388.5v45"/>
    <path d="M1480 690h52"/>
    <path d="M1468 747h55M1468 767h55"/>
  </g>

  <!-- Small counting groups -->
  <g opacity=".26" fill="#FF6FA5">
    <circle cx="91" cy="565" r="8"/><circle cx="118" cy="565" r="8"/><circle cx="145" cy="565" r="8"/>
  </g>
  <g opacity=".24" fill="#5FCFA0">
    <circle cx="1470" cy="590" r="7"/><circle cx="1494" cy="590" r="7"/><circle cx="1518" cy="590" r="7"/><circle cx="1542" cy="590" r="7"/>
  </g>

  <!-- Stars -->
  <g fill="#FFD45E" opacity=".4">
    <path d="m263 858 7 14 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2 7-14Z"/>
    <path d="m1377 88 6 12 13 2-10 9 3 13-12-7-12 7 3-13-10-9 13-2 6-12Z"/>
  </g>
</svg>
