<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 12 160 168" role="img" aria-labelledby="title description">
  <title id="title">Koda</title>
  <desc id="description">The Koda owl mascot.</desc>
  <!-- The generic learner fallback, referenced by name from the placement warm-up, the
       component preview, and resolveTechniqueThumbnail's last resort. Transparent
       background on purpose: every surface that shows it supplies its own card, so a
       baked tile would read as a second one. viewBox is cropped to the artwork. -->
  <defs>
    <linearGradient id="owl-body" x1="60" y1="36" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B86FF"/>
      <stop offset="1" stop-color="#7A5CF0"/>
    </linearGradient>
    <filter id="owl-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5C46B8" flood-opacity=".22"/>
    </filter>
  </defs>

  <g filter="url(#owl-shadow)">
    <!-- Ear tufts sit behind the head so the silhouette stays one shape. -->
    <path d="M64 54 74 24 94 46Z" fill="#7A5CF0"/>
    <path d="M136 54 126 24 106 46Z" fill="#7A5CF0"/>

    <path d="M100 36c-30 0-52 24-52 56v22c0 28 23 48 52 48s52-20 52-48V92c0-32-22-56-52-56Z" fill="url(#owl-body)"/>

    <!-- Wings, tucked. Darker than the body so they read against it at 32px. -->
    <path d="M52 98c-7 20-5 39 4 52 5 7 12 5 12-4-6-16-7-33-4-48 2-8-8-8-12 0Z" fill="#8A72F7"/>
    <path d="M148 98c7 20 5 39-4 52-5 7-12 5-12-4 6-16 7-33 4-48-2-8 8-8 12 0Z" fill="#8A72F7"/>

    <ellipse cx="100" cy="126" rx="29" ry="33" fill="#EFE9FF"/>

    <circle cx="80" cy="86" r="21" fill="#fff"/>
    <circle cx="120" cy="86" r="21" fill="#fff"/>
    <circle cx="80" cy="88" r="9.5" fill="#2B2150"/>
    <circle cx="120" cy="88" r="9.5" fill="#2B2150"/>
    <circle cx="83.5" cy="84" r="3.4" fill="#fff"/>
    <circle cx="123.5" cy="84" r="3.4" fill="#fff"/>

    <path d="M100 99l9.5 11.5L100 119l-9.5-8.5Z" fill="#FFB13B"/>

    <path d="M85 159v8m-6-4h12M115 159v8m-6-4h12" stroke="#FFB13B" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
