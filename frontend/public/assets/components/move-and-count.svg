<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 61 435 435" role="img" aria-labelledby="title description">
  <title id="title">Move and Count</title>
  <desc id="description">Colorful objects moving from one counting basket to another.</desc>
  <!-- Transparent background on purpose: the student hero and every thumbnail chip
       supply their own white surface, so a baked tile would read as a second card.
       viewBox is cropped to the artwork so the subject fills the frame. -->
  <defs>
    <linearGradient id="left-basket" x1="96" y1="280" x2="230" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B73F7"/>
      <stop offset="1" stop-color="#5B43DD"/>
    </linearGradient>
    <linearGradient id="right-basket" x1="286" y1="280" x2="420" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D6A7"/>
      <stop offset="1" stop-color="#20A978"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4F4A82" flood-opacity=".2"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M82 282h164l-18 130c-2 15-15 26-30 26h-68c-15 0-28-11-30-26Z" fill="url(#left-basket)"/>
    <path d="M266 282h164l-18 130c-2 15-15 26-30 26h-68c-15 0-28-11-30-26Z" fill="url(#right-basket)"/>
  </g>

  <g fill="none" stroke="#FFF" stroke-linecap="round" stroke-width="9" opacity=".78">
    <path d="M111 319h106"/>
    <path d="M121 354h86"/>
    <path d="M295 319h106"/>
    <path d="M305 354h86"/>
  </g>

  <!-- Rims are light lilac, not white: these objects overlap each other, and a pure
       white seam disappears once the artwork is composited onto a white card. -->
  <g stroke="#E7E0FF" stroke-width="5">
    <circle cx="128" cy="244" r="29" fill="#FF6F91"/>
    <circle cx="179" cy="224" r="29" fill="#FFBF3E"/>
    <circle cx="211" cy="259" r="29" fill="#55BEEB"/>
    <circle cx="336" cy="230" r="29" fill="#FF9B4A"/>
    <circle cx="386" cy="253" r="29" fill="#7964F5"/>
  </g>

  <path d="M214 142h91" fill="none" stroke="#6953E8" stroke-linecap="round" stroke-width="20"/>
  <path d="m285 116 31 26-31 26" fill="none" stroke="#6953E8" stroke-linecap="round" stroke-linejoin="round" stroke-width="20"/>

  <!-- Generic font stack: this art renders inside <img>, where a macOS-only family
       would silently fall back and shift the numerals on other platforms. -->
  <g fill="#6953E8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="164" y="118" font-size="54">3</text>
    <text x="348" y="118" font-size="54">2</text>
  </g>

  <g fill="#CFC4FF">
    <circle cx="87" cy="155" r="8"/>
    <circle cx="429" cy="178" r="7"/>
    <circle cx="252" cy="76" r="5"/>
  </g>
</svg>
