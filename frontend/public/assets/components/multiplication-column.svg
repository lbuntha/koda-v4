<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Column Multiplication</title>
  <desc id="description">Two numbers stacked for column multiplication.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card. Shared 200x200 viewBox so the whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B86FF"/><stop offset="1" stop-color="#7A5CF0"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#5C46B8" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <text x="148" y="62" fill="#5C46B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="end">23</text>
    <text x="148" y="102" fill="#5C46B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="end">4</text>
    <text x="56" y="102" fill="#7A5CF0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="40" font-weight="900">×</text>
    <path d="M48 118h104" stroke="#7A5CF0" stroke-width="7" stroke-linecap="round"/>
    <rect x="108" y="132" width="44" height="10" rx="5" fill="#7A5CF0" opacity=".3"/>
  </g>
</svg>
