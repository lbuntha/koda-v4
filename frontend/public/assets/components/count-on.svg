<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Count On</title>
  <desc id="description">Starting at five and counting three more forward.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card, so a baked tile would read as a second one. viewBox is a shared 200x200 so the
       whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FD8FF"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0B6E9C" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <text x="52" y="112" fill="#0EA5E9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="60" font-weight="900" text-anchor="middle">5</text>
    <circle cx="102" cy="95" r="12" fill="url(#g)"/>
    <circle cx="132" cy="95" r="12" fill="url(#g)"/>
    <circle cx="162" cy="95" r="12" fill="url(#g)"/>
    <path d="M92 140h72" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round"/>
    <path d="M156 131l12 9-12 9" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
