<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Subtraction Sandbox</title>
  <desc id="description">Objects being taken away from a group.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card. Shared 200x200 viewBox so the whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8A9B"/><stop offset="1" stop-color="#E03A5E"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#B02745" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <circle cx="78" cy="96" r="10" fill="url(#g)"/>
    <circle cx="54" cy="96" r="10" fill="url(#g)"/>
    <circle cx="102" cy="96" r="10" fill="url(#g)"/>
    <circle cx="66.0" cy="120" r="10" fill="url(#g)"/>
    <circle cx="90.0" cy="120" r="10" fill="url(#g)"/>
    <circle cx="146" cy="96" r="10" fill="none" stroke="#E03A5E" stroke-width="3" stroke-dasharray="4 4"/>
    <circle cx="146" cy="72" r="10" fill="none" stroke="#E03A5E" stroke-width="3" stroke-dasharray="4 4"/>
    <text x="118" y="110" fill="#E03A5E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="38" font-weight="900" text-anchor="middle">−</text>
  </g>
</svg>
