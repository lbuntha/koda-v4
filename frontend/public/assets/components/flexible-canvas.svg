<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Flexible Canvas</title>
  <desc id="description">An open canvas holding mixed shapes.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card. Shared 200x200 viewBox so the whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B86FF"/><stop offset="1" stop-color="#7A5CF0"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#5C46B8" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <rect x="34" y="46" width="132" height="108" rx="18" fill="#F4F1FF" stroke="#5C46B8" stroke-width="4" stroke-dasharray="10 8"/>
    <circle cx="72" cy="88" r="14" fill="url(#g)"/>
    <rect x="98" y="74" width="28" height="28" rx="8" fill="#F59E0B"/>
    <path d="M132 102l14-28 14 28Z" fill="#16A34A"/>
    <path d="M60 126h80" stroke="#7A5CF0" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
