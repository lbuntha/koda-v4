<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Number Sudoku</title>
  <desc id="description">A three by three number grid, partly filled.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card. Shared 200x200 viewBox so the whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B86FF"/><stop offset="1" stop-color="#7A5CF0"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#5C46B8" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <rect x="46" y="46" width="32" height="32" rx="8" fill="url(#g)"/>
    <text x="62" y="70" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle">1</text>
    <rect x="84" y="46" width="32" height="32" rx="8" fill="#EDE9FF"/>
    <rect x="122" y="46" width="32" height="32" rx="8" fill="url(#g)"/>
    <text x="138" y="70" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle">2</text>
    <rect x="46" y="84" width="32" height="32" rx="8" fill="#EDE9FF"/>
    <rect x="84" y="84" width="32" height="32" rx="8" fill="url(#g)"/>
    <text x="100" y="108" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle">2</text>
    <rect x="122" y="84" width="32" height="32" rx="8" fill="#EDE9FF"/>
    <rect x="46" y="122" width="32" height="32" rx="8" fill="#EDE9FF"/>
    <rect x="84" y="122" width="32" height="32" rx="8" fill="#EDE9FF"/>
    <rect x="122" y="122" width="32" height="32" rx="8" fill="url(#g)"/>
    <text x="138" y="146" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle">3</text>
  </g>
</svg>
