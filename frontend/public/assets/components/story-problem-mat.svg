    <text x="145" y="263">🍎</text><text x="215" y="263">🍎</text>
    <text x="420" y="218">🍎</text><text x="485" y="218">🍎</text><text x="535" y="218">🍎</text>
  </g>
  <circle cx="320" cy="212" r="32" fill="#7C3AED"/>
  <path d="M306 212h28M320 198v28" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <rect x="247" y="342" width="146" height="42" rx="18" fill="#7C3AED"/>
  <text x="320" y="371" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">5 + 3 = ?</text>
