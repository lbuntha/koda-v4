  <rect x="42" y="98" width="556" height="228" rx="30" fill="#fff" filter="url(#shadow)"/>
  <rect x="70" y="130" width="205" height="164" rx="24" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="3"/>
