<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Liquid Sort</title>
  <desc id="description">Bottles of coloured liquid waiting to be sorted.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card. Shared 200x200 viewBox so the whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FD8FF"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0B6E9C" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <rect x="44" y="56" width="30" height="94" rx="14" fill="#EAF4FF" stroke="#0B6E9C" stroke-width="3"/>
    <rect x="47" y="120" width="24" height="28" rx="9" fill="#0EA5E9"/>
    <rect x="47" y="90" width="24" height="28" rx="9" fill="#16A34A"/>
    <rect x="84" y="56" width="30" height="94" rx="14" fill="#EAF4FF" stroke="#0B6E9C" stroke-width="3"/>
    <rect x="87" y="120" width="24" height="28" rx="9" fill="#F59E0B"/>
    <rect x="87" y="90" width="24" height="28" rx="9" fill="#E03A5E"/>
    <rect x="124" y="56" width="30" height="94" rx="14" fill="#EAF4FF" stroke="#0B6E9C" stroke-width="3"/>
    <rect x="127" y="120" width="24" height="28" rx="9" fill="#16A34A"/>
    <rect x="127" y="90" width="24" height="28" rx="9" fill="#16A34A"/>
  </g>
</svg>
