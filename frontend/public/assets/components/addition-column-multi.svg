<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Multi-row Column Addition</title>
  <desc id="description">Three numbers stacked for column addition.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card. Shared 200x200 viewBox so the whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FE0A6"/><stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0E7A48" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <text x="148" y="62" fill="#0E7A48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="end">12</text>
    <text x="148" y="102" fill="#0E7A48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="end">24</text>
    <text x="148" y="142" fill="#0E7A48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="end">31</text>
    <text x="56" y="142" fill="#16A34A" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="40" font-weight="900">+</text>
    <path d="M48 158h104" stroke="#16A34A" stroke-width="7" stroke-linecap="round"/>
    <rect x="108" y="172" width="44" height="10" rx="5" fill="#16A34A" opacity=".3"/>
  </g>
</svg>
