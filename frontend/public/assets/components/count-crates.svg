<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Counting Crates</title>
  <desc id="desc">An order for twenty-six, a bar showing ten, ten, five and one filling it exactly, and three crates below: a ten-frame of ten, a row of five, and a single.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFBEB"/><stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFDF5"/><stop offset="1" stop-color="#FFF8E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dy="8" stdDeviation="9" flood-color="#3F2D0B" flood-opacity=".13"/>
    </filter>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dy="4" stdDeviation="4" flood-color="#3F2D0B" flood-opacity=".18"/>
    </filter>
    <!-- Slats, so a crate reads as a wooden box rather than a coloured tile. -->
    <pattern id="slats" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="none"/>
      <rect width="1" height="10" fill="#000" opacity=".07"/>
    </pattern>
  </defs>

  <rect width="640" height="400" rx="38" fill="url(#bg)"/>
  <rect x="38" y="40" width="564" height="302" rx="30" fill="#fff" filter="url(#shadow)"/>

  <!-- The order, on its ticket. -->
  <g>
    <rect x="70" y="72" width="228" height="74" rx="12" fill="url(#ticket)"/>
    <rect x="70" y="72" width="7" height="74" rx="3.5" fill="#FBBF24"/>
    <text x="96" y="101" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
          font-size="15" font-weight="800" letter-spacing="2.5" fill="#A16207">ORDER</text>
    <text x="96" y="136" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
          font-size="38" font-weight="800" fill="#1F2937">26</text>
    <circle cx="252" cy="112" r="21" fill="#FDE68A"/>
    <path d="M243 114c3-9 15-9 18 0 1 5-3 9-9 9s-10-4-9-9z" fill="#F59E0B"/>
    <rect x="249" y="92" width="6" height="10" rx="3" fill="#65A30D"/>
  </g>

  <!-- The bar model: 10 + 10 + 5 + 1, the same 26 seen as length rather than as digits. -->
  <g filter="url(#lift)">
    <rect x="70" y="172" width="500" height="40" rx="20" fill="#F1F5F9"/>
    <clipPath id="strip"><rect x="70" y="172" width="500" height="40" rx="20"/></clipPath>
    <g clip-path="url(#strip)">
      <rect x="70"  y="172" width="192" height="40" fill="#6EE7B7"/>
      <rect x="262" y="172" width="192" height="40" fill="#6EE7B7"/>
      <rect x="454" y="172" width="96"  height="40" fill="#7DD3FC"/>
      <rect x="550" y="172" width="20"  height="40" fill="#FCD34D"/>
      <rect x="261" y="172" width="2" height="40" fill="#fff" opacity=".85"/>
      <rect x="453" y="172" width="2" height="40" fill="#fff" opacity=".85"/>
      <rect x="549" y="172" width="2" height="40" fill="#fff" opacity=".85"/>
    </g>
    <text x="157" y="199" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
          font-size="17" font-weight="800" fill="#065F46">10</text>
    <text x="349" y="199" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
          font-size="17" font-weight="800" fill="#065F46">10</text>
    <text x="497" y="199" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
          font-size="17" font-weight="800" fill="#075985">5</text>
  </g>

  <!-- The crates themselves, each showing what is inside it. -->
  <g filter="url(#lift)">
    <!-- Ten: a ten-frame, so "ten is two rows of five" is visible without counting. -->
    <rect x="70" y="238" width="132" height="86" rx="16" fill="#A7F3D0"/>
    <rect x="70" y="238" width="132" height="86" rx="16" fill="url(#slats)"/>
    <rect x="86" y="252" width="100" height="34" rx="5" fill="none" stroke="#047857" stroke-width="2.5" opacity=".45"/>
    <line x1="136" y1="252" x2="136" y2="286" stroke="#047857" stroke-width="2.5" opacity=".45"/>
    <line x1="86" y1="269" x2="186" y2="269" stroke="#047857" stroke-width="2.5" opacity=".45"/>
    <g fill="#047857" opacity=".6">
      <circle cx="96" cy="261" r="5"/><circle cx="116" cy="261" r="5"/><circle cx="136" cy="261" r="5"/>
      <circle cx="156" cy="261" r="5"/><circle cx="176" cy="261" r="5"/>
      <circle cx="96" cy="278" r="5"/><circle cx="116" cy="278" r="5"/><circle cx="136" cy="278" r="5"/>
      <circle cx="156" cy="278" r="5"/><circle cx="176" cy="278" r="5"/>
    </g>
    <text x="136" y="315" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
          font-size="22" font-weight="800" fill="#065F46">10</text>

    <!-- Five: a row, the way fingers come. -->
    <rect x="218" y="238" width="132" height="86" rx="16" fill="#BAE6FD"/>
    <rect x="218" y="238" width="132" height="86" rx="16" fill="url(#slats)"/>
    <g fill="#0369A1" opacity=".6">
      <circle cx="252" cy="268" r="6"/><circle cx="270" cy="268" r="6"/><circle cx="288" cy="268" r="6"/>
      <circle cx="306" cy="268" r="6"/><circle cx="324" cy="268" r="6"/>
    </g>
    <text x="284" y="315" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
          font-size="22" font-weight="800" fill="#075985">5</text>

    <!-- One. -->
    <rect x="366" y="238" width="132" height="86" rx="16" fill="#FDE68A"/>
    <rect x="366" y="238" width="132" height="86" rx="16" fill="url(#slats)"/>
    <circle cx="432" cy="270" r="15" fill="#B45309" opacity=".6"/>
    <text x="432" y="315" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
          font-size="22" font-weight="800" fill="#92400E">1</text>

    <!-- The tray they are heading for. -->
    <rect x="514" y="238" width="56" height="86" rx="16" fill="none"
          stroke="#CBD5E1" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M528 281h28M542 267v28" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
