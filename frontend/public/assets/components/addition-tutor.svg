<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Addition Tutor</title>
  <desc id="description">A guided addition step with a hint.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card. Shared 200x200 viewBox so the whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FD8FF"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0B6E9C" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <rect x="40" y="52" width="120" height="76" rx="18" fill="url(#g)"/>
    <text x="100" y="104" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="900" text-anchor="middle">3+4</text>
    <path d="M104 138c14 6 26 6 38-2" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M148 128l8 8-10 6" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="72" cy="146" r="14" fill="#F59E0B"/>
    <path d="M66 146l5 6 9-11" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
