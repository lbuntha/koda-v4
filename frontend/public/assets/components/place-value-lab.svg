      <rect width="244" height="32" rx="9"/><rect y="50" width="244" height="32" rx="9"/><rect y="100" width="244" height="32" rx="9"/>
    </g>
    <g stroke="#A5B4FC" stroke-width="2">
      <path d="M24 0v32M48 0v32M72 0v32M96 0v32M120 0v32M144 0v32M168 0v32M192 0v32M216 0v32"/>
      <path d="M24 50v32M48 50v32M72 50v32M96 50v32M120 50v32M144 50v32M168 50v32M192 50v32M216 50v32"/>
      <path d="M24 100v32M48 100v32M72 100v32M96 100v32M120 100v32M144 100v32M168 100v32M192 100v32M216 100v32"/>
    </g>
  </g>
  <g fill="#C7D2FE" stroke="#6366F1" stroke-width="3">
    <rect x="410" y="166" width="46" height="46" rx="10"/><rect x="480" y="166" width="46" height="46" rx="10"/>
    <rect x="410" y="232" width="46" height="46" rx="10"/><rect x="480" y="232" width="46" height="46" rx="10"/>
  </g>
  <rect x="247" y="346" width="146" height="40" rx="18" fill="#4F46E5"/>
  <text x="320" y="374" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">30 + 4 = 34</text>
