<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Place Value Lab</title>
  <desc id="desc">Three tens rods and four one blocks arranged on a place-value mat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEF2FF"/><stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="8" stdDeviation="9" flood-color="#312E81" flood-opacity=".13"/></filter>
  </defs>
  <rect width="640" height="400" rx="38" fill="url(#bg)"/>
  <rect x="38" y="48" width="564" height="286" rx="30" fill="#fff" filter="url(#shadow)"/>
  <rect x="66" y="90" width="302" height="214" rx="24" fill="#F5F7FF"/>
  <rect x="382" y="90" width="192" height="214" rx="24" fill="#F1F5F9"/>
