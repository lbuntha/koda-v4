<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">One to One</title>
  <desc id="description">Four objects, each matched with a single tick.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card, so a baked tile would read as a second one. viewBox is a shared 200x200 so the
       whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B86FF"/><stop offset="1" stop-color="#7A5CF0"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#5C46B8" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <circle cx="40" cy="78" r="11" fill="url(#g)"/>
    <circle cx="80" cy="78" r="11" fill="url(#g)"/>
    <circle cx="120" cy="78" r="11" fill="url(#g)"/>
    <circle cx="160" cy="78" r="11" fill="url(#g)"/>
    <path d="M28 122l9 10 15-18" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M68 122l9 10 15-18" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M108 122l9 10 15-18" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M148 122l9 10 15-18" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
