<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Group in Tens</title>
  <desc id="description">A full ten-frame beside three loose ones.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card, so a baked tile would read as a second one. viewBox is a shared 200x200 so the
       whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FE0A6"/><stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0E7A48" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <rect x="30" y="62" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="56" y="62" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="82" y="62" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="108" y="62" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="134" y="62" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="30" y="88" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="56" y="88" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="82" y="88" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="108" y="88" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="134" y="88" width="24" height="24" rx="6" fill="url(#g)" opacity="1"/>
    <rect x="26" y="58" width="136" height="60" rx="12" fill="none" stroke="#16A34A" stroke-width="4"/>
    <circle cx="46" cy="148" r="11" fill="#F59E0B"/>
    <circle cx="76" cy="148" r="11" fill="#F59E0B"/>
    <circle cx="106" cy="148" r="11" fill="#F59E0B"/>
  </g>
</svg>
