<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Line Up and Count</title>
  <desc id="description">Four objects in a line, numbered one to four.</desc>
  <!-- Transparent background on purpose: every surface that shows this supplies its own
       card, so a baked tile would read as a second one. viewBox is a shared 200x200 so the
       whole technique set sits at one optical weight. -->
  <defs>
    <linearGradient id="g" x1="30" y1="30" x2="170" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B86FF"/><stop offset="1" stop-color="#7A5CF0"/>
    </linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#5C46B8" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <rect x="26" y="62" width="28" height="44" rx="9" fill="url(#g)"/>
    <rect x="64" y="62" width="28" height="44" rx="9" fill="url(#g)"/>
    <rect x="102" y="62" width="28" height="44" rx="9" fill="url(#g)"/>
    <rect x="140" y="62" width="28" height="44" rx="9" fill="url(#g)"/>
    <text x="40" y="146" fill="#5C46B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">1</text>
    <text x="78" y="146" fill="#5C46B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">2</text>
    <text x="116" y="146" fill="#5C46B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">3</text>
    <text x="154" y="146" fill="#5C46B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">4</text>
  </g>
</svg>
