<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Number Path and 120 Chart</title>
  <desc id="desc">A friendly purple number path above a compact number chart.</desc>
