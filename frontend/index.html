<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Strictly disable zoom & scaling for native PWA app feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Learn with Koda</title>
    <meta name="description" content="A playful learning app where children practice skills, explore ideas, and grow with confidence." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installed-app chrome. The web app manifest itself is injected by vite-plugin-pwa. -->
    <meta name="theme-color" content="#6B46C1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS reads its own tags rather than the manifest for standalone launch + icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": translucent makes the web view start *behind*
         the status bar, and every top header here is `sticky top-0` with no top inset, so
         the clock and the header's first row shared the same pixels on a notched iPhone. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Koda" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
