# For a server whose nginx already owns ports 80/443 (Koda's VPS runs n8n and
# others behind it). deploy.sh installs this as
# /etc/nginx/sites-available/koda with KODA_DOMAIN and KODA_PORT filled in;
# `certbot --nginx -d <domain>` then adds HTTPS to it.
#
# The app already sends compressed files and handles its own caching headers,
# so this only forwards — plus the two things nginx does not do by default:
# upgrade WebSockets (voice coach, Rebus group play) and keep them open.

map $http_upgrade $koda_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name KODA_DOMAIN;

    # Book recordings and photos are uploaded through here.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:KODA_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $koda_connection;
        # A voice session or a group game is one long-lived connection.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
