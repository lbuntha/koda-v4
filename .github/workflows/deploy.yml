name: CI & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: koda-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: learn-with-koda
  GCP_REGION: us-central1
  ARTIFACT_REPOSITORY: koda-repo
  API_SERVICE: koda-backend
  APP_SERVICE: koda-app

jobs:
  ci-verification:
    name: CI & Verification
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run frontend and Node tests
        run: npm test

      - name: Build production app
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e "./server[dev]"

      - name: Lint API
        working-directory: server
        run: ruff check app tests

      - name: Test API
        working-directory: server
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          JWT_SECRET: ci-only-secret-at-least-32-characters
        run: pytest -q

  deploy-api:
    name: Deploy FastAPI service
    runs-on: ubuntu-latest
    needs: ci-verification
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TUTOR_SERVICE_TOKEN: ${{ secrets.TUTOR_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require production secrets
        run: |
          test -n "$MONGODB_URI"
          test -n "$JWT_SECRET"
          test -n "$TUTOR_SERVICE_TOKEN"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/koda-api:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" server
          docker push "$IMAGE"

      - name: Deploy API to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/koda-api:${{ github.sha }}
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --port 8000 \
            --allow-unauthenticated \
            --set-env-vars "^|^ENVIRONMENT=production|MONGODB_URI=${MONGODB_URI}|MONGODB_DB=koda_v4|JWT_SECRET=${JWT_SECRET}|TUTOR_SERVICE_TOKEN=${TUTOR_SERVICE_TOKEN}|APP_BASE_URL=https://learn-with-koda.web.app"

      - name: Verify API health
        run: |
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 "$api_url/v1/health"

  deploy-app:
    name: Deploy Koda web service
    runs-on: ubuntu-latest
    needs: [ci-verification, deploy-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      TUTOR_SERVICE_TOKEN: ${{ secrets.TUTOR_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require production secrets
        run: test -n "$TUTOR_SERVICE_TOKEN"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push app image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/koda-app:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --target prod -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Resolve API service URL
        id: api
        run: |
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$api_url"
          echo "url=$api_url" >> "$GITHUB_OUTPUT"

      - name: Deploy app to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/koda-app:${{ github.sha }}
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          gcloud run deploy "$APP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --port 3001 \
            --allow-unauthenticated \
            --set-env-vars "^|^NODE_ENV=production|API_URL=${API_URL}|TUTOR_SERVICE_TOKEN=${TUTOR_SERVICE_TOKEN}"

      - name: Verify app health
        run: |
          app_url="$(gcloud run services describe "$APP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --show-error --silent --retry 6 --retry-all-errors --retry-delay 5 "$app_url/" > /dev/null

  deploy-hosting:
    name: Route Firebase Hosting to Koda
    runs-on: ubuntu-latest
    needs: deploy-app
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Firebase Hosting configuration
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: learn-with-koda
          entryPoint: .
