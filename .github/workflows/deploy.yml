name: Deploy to Google Cloud & Firebase

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Cloud Run Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Backend Docker Image
        run: |
          docker build --platform linux/amd64 -t us-central1-docker.pkg.dev/learn-with-koda/koda-repo/koda-backend:latest ./backend
          docker push us-central1-docker.pkg.dev/learn-with-koda/koda-repo/koda-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy koda-backend \
            --image us-central1-docker.pkg.dev/learn-with-koda/koda-repo/koda-backend:latest \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars MONGO_URI="mongodb+srv://jutta:thana130114@cluster0.p7gsjyv.mongodb.net",MONGO_DB="koda_v4",ENVIRONMENT="production",JWT_SECRET="dev-jwt-secret-key-32-chars-long",CORS_ORIGINS='["https://learn-with-koda.web.app"]'

  deploy-frontend:
    name: Deploy Firebase Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build
        env:
          VITE_API_URL: https://koda-backend-140757924603.us-central1.run.app

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.GCP_SA_KEY }}'
          channelId: live
          projectId: learn-with-koda
          entryPoint: ./frontend
