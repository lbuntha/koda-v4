name: CI & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push or a pull request runs the tests only. Deploying is separate:
  # "Run workflow" in the Actions tab runs the tests, then the VPS. Day to day
  # the VPS is deployed straight from a Mac (deploy/vps/deploy.sh --no-pull),
  # so a push here is a check after the fact, not a gate in front of going live.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koda-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two test jobs start together: the app's checks and the API's checks. On a
  # manual run the images build alongside them, and the deploy waits for all
  # three, so nothing reaches the server unless every test passed.
  web:
    name: App tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run frontend and Node tests
        run: npm test

      - name: Build production app
        run: npm run build

  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e "./server[dev]"

      - name: Install audio encoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint API
        working-directory: server
        run: ruff check app tests

      # Every test gets its own throwaway database (tests/conftest.py), so
      # they can run on all the runner's cores at once.
      - name: Test API
        working-directory: server
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          JWT_SECRET: ci-only-secret-at-least-32-characters
        run: pytest -q -n auto

  # Built alongside the tests rather than after them, with layers cached
  # between runs. Pushed under the commit's tag only: `latest` moves in the
  # deploy job, once the tests have passed.
  images:
    name: Build images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.VPS_HOST != ''
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ghcr.io/lbuntha/koda-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_VAPID_KEY=${{ vars.VITE_FIREBASE_VAPID_KEY }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/lbuntha/koda-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # Production: the VPS (deploy/vps). Google Cloud Run is retired; only
  # Firebase (push notifications) is still used, from the server itself.
  #
  # The images are built on GitHub and pushed to ghcr.io; the server only
  # pulls them, because it is shared with other services and the web build
  # needs more memory than it can spare.
  #
  # Off until the repository variable VPS_HOST is set — the job is skipped,
  # not failed. Then it also needs the secrets VPS_SSH_KEY (a private key
  # whose public half is in the server's authorized_keys) and VPS_KNOWN_HOSTS
  # (`ssh-keyscan <ip>`, taken once from a machine you trust, so a server
  # answering in its place is refused rather than deployed to).
  deploy-vps:
    name: Deploy to the VPS
    runs-on: ubuntu-latest
    needs: [web, api, images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.VPS_HOST != ''
    permissions:
      contents: read
      packages: write
    concurrency:
      group: koda-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark the tested images as latest
        run: |
          for image in ghcr.io/lbuntha/koda-app ghcr.io/lbuntha/koda-api; do
            docker buildx imagetools create -t "$image:latest" "$image:${{ github.sha }}"
          done

      - name: Install the SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull and start on the server
        env:
          VPS: ${{ vars.VPS_USER || 'root' }}@${{ vars.VPS_HOST }}
          KODA_TAG: ${{ github.sha }}
          # Lives for this job only; the server logs out again after the pull.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/vps/deploy.sh

