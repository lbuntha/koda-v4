<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so a standalone window can paint into the safe areas
         on a notched device; the layout pads itself back off them in CSS.

         Zoom is locked at 1. Every screen here is already laid out for a phone,
         and the interactions are drags on a play area: pinching mid-drag left a
         child looking at a corner of a counting grid with no obvious way back,
         which for a five-year-old is a broken app. Android honours
         `user-scalable=no`; iOS has ignored it since iOS 10, so `touch-action`
         in index.css and the `gesturestart` guard in blockPinchZoom.ts do the
         real work there. All three together, because each covers a gap the
         others leave. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Learn with Koda</title>
    <meta
      name="description"
      content="Counting, addition, number bonds — reading next. Ages 5–11. Works offline, no ads."
    />

    <!-- Address bar and standalone chrome. Two values so the bar matches the
         theme the child is actually looking at. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#6B46C1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F172A" />

    <!-- The sign-in screen fetches Google's button code from here the moment it
         mounts. Opening the connection during head parsing means the TLS
         handshake is already paid for by then, which is the part of the wait
         that shows as an empty box in the form. Costs nothing on the screens
         that never ask: an unused preconnect is closed again. -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS reads none of the manifest's icons, only this. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Koda" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="Koda — Math for Young Learners" />
    <meta
      property="og:description"
      content="Counting, comparing and place value practice for 5–6 year olds. Works offline."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The theme, before the first pixel.

         `ThemeContext` puts `.dark` on <html> from a React effect, which runs
         after the browser has already painted — so a dark-theme device showed
         the light canvas for a frame and then flipped to near-black. On the
         sign-in screen, the first thing any device renders, that flash is the
         whole page.

         This reads the same `localStorage` document `lib/preferences.ts` reads
         (and the same legacy key it falls back to), and sets the same classes
         the effect sets, so the effect finds its work already done and changes
         nothing. Inline and synchronous on purpose: a deferred or external
         script is exactly the paint this is trying to get in front of.

         The two colours below duplicate `--koda-canvas` from index.css because
         in dev the stylesheet arrives with the JS bundle, well after this runs.
         They are the page background only; if the canvas token changes, change
         them here too. -->
    <style>
      html { background-color: #F8FAFC; }
      html.dark { background-color: #0d061a; }
    </style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("koda_preferences_v1");
          var theme = raw
            ? JSON.parse(raw).theme
            : localStorage.getItem("synthesis_tutor_theme");
          var root = document.documentElement;
          if (theme === "dark") root.classList.add("theme-dark", "dark");
          else root.classList.add("theme-light");
        } catch (e) {
          document.documentElement.classList.add("theme-light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
