<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so a standalone window can paint into the safe areas
         on a notched device; the layout pads itself back off them in CSS.

         Zoom is locked at 1. Every screen here is already laid out for a phone,
         and the interactions are drags on a play area: pinching mid-drag left a
         child looking at a corner of a counting grid with no obvious way back,
         which for a five-year-old is a broken app. Android honours
         `user-scalable=no`; iOS has ignored it since iOS 10, so `touch-action`
         in index.css and the `gesturestart` guard in blockPinchZoom.ts do the
         real work there. All three together, because each covers a gap the
         others leave. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Koda Tutor</title>
    <meta
      name="description"
      content="Counting, comparing and place value practice for 5–6 year olds. Works offline."
    />

    <!-- Address bar and standalone chrome. Two values so the bar matches the
         theme the child is actually looking at. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#6B46C1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F172A" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS reads none of the manifest's icons, only this. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Koda" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="Koda — Math for Young Learners" />
    <meta
      property="og:description"
      content="Counting, comparing and place value practice for 5–6 year olds. Works offline."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
